name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  schedule:
    # cron every week on monday
    - cron: "0 0 * * 2"

permissions:
  contents: write
  pull-requests: write

jobs:
  tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"
    # the e2e suite is skipped without --e2e, so this stays a unit test run

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
      - name: Install dependencies
        run: uv sync --locked --dev --all-extras
      - name: Check dependencies
        run: uv lock --check
      - name: Pytest
        run: uv run pytest -v --cov=./sqlargon --cov-report term-missing --cov-report xml:/tmp/coverage.xml --junitxml=/tmp/pytest.xml ./tests
      - name: Coverage Report
        if: matrix.python-version == '3.14'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: /tmp/coverage.xml
          junitxml-path: /tmp/pytest.xml
      - name: Ruff
        if: matrix.python-version == '3.14'
        run: |
          uv run ruff check ./sqlargon
          uv run ruff format ./sqlargon --check
      - name: Mypy
        if: matrix.python-version == '3.14'
        run: uv run mypy ./sqlargon
      - name: Bandit
        if: matrix.python-version == '3.14'
        run: uv run bandit --skip B101 -r ./sqlargon

  e2e:
    strategy:
      fail-fast: false
      matrix:
        backend: ["sqlite", "postgres", "mysql", "mariadb"]
    name: "E2E ${{ matrix.backend }}"
    runs-on: "ubuntu-latest"
    # testcontainers talks to the Docker daemon of the runner, so the servers
    # are started and torn down by the suite itself

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # the newest version asyncmy publishes wheels for
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
      - name: Install dependencies
        run: uv sync --locked --dev --all-extras
      - name: Pytest
        run: >
          uv run pytest -v --no-cov --count=1
          --e2e --e2e-backends=${{ matrix.backend }}
          ./tests/e2e
