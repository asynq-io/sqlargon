[project]
name = "sqlargon"
version = "1.0.4b1"
description = "SQLAlchemy repository pattern and utilities"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [{ name = "RaRhAeu", email = "rarha_eu@protonmail.com" }]
dependencies = [
    "sqlalchemy>2.0,<3",
    "alembic>=1.13.1,<2",
    "orjson>=3.11.9,<4",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.1.0,<3",
    "uuid-utils>=0.16.0,<1",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
postgres = ["asyncpg<1.0"]
sqlite = ["aiosqlite>=0.19.0,<1"]
mysql = ["asyncmy>=0.2.11"]
pagination = ["sqlakeyset>=2.0.1716332987,<3"]
cron = ["croniter>=2.0,<7", "anyio>=4.0,<5"]
opentelemetry = ["opentelemetry-instrumentation-sqlalchemy"]

standard = ["asyncpg<1.0", "aiosqlite>=0.19.0,<1", "sqlakeyset>=2.0.1716332987,<3", "croniter>=2.0,<7", "anyio>=4.0,<5", "opentelemetry-instrumentation-sqlalchemy"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "e2e" },
    { include-group = "docs" },
    "fastapi>=0.138.0",
    "greenlet",
]

e2e = [
    "testcontainers>=4.15.0",
    # asyncmy needs it for the caching_sha2_password auth of MySQL 8
    "cryptography",
]

test = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "pytest-repeat",
    "pytest-asyncio",
    "httpx>=0.28.1",
    "pytest-timeout>=2.4.0",
]

lint = [
    "mypy",
    "ruff",
    "bandit",
    "deptry",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-autorefs",
    "mkdocs-gen-files",
    "mkdocstrings[python]",
    "watchdog>=2.0,<4.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
addopts = "--cov=./sqlargon --count=3"
testpaths = ["./tests"]
asyncio_mode = "auto"
timeout = 20
markers = [
    "e2e: runs against a real database backend; enabled with --e2e",
]

[tool.mypy]
python_version = "3.10"
namespace_packages = true
ignore_missing_imports = true
no_site_packages = true
disable_error_code = ["annotation-unchecked"]
exclude = ["^tmp/"]

[[tool.mypy.overrides]]
# croniter ships no py.typed marker and its stubs (types-croniter) live in
# site-packages, which this config deliberately ignores
module = ["croniter.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "A002",
    "ANN401",
    "COM812",
    "CPY001",
    "D",
    "B008",     # do not perform function calls in argument defaults
    "E501",     # line too long
    "N801",     # allow snake_case class names for SQL function elements
    "N818",
    "PTH123",
    "PLW2901"
]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemyUnitOfWork resolves subclass annotations with get_type_hints,
# so annotations on units of work must be importable at runtime.
runtime-evaluated-base-classes = ["sqlargon.uow.AbstractUnitOfWork"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "declared_attr",
    "declared_attr.directive",
    "sqlalchemy.orm.declared_attr.directive",
]

[tool.ruff.lint.per-file-ignores]
"sqlargon/*" = ["PLC0415"]
"sqlargon/types/*" = ["ARG002"]
"tests/*" = ["S101", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "SLF001", "PLR2004", "ARG002"]
# a fixture requested for its side effect only, and testcontainers imported
# lazily so an ordinary run never pulls it in
"tests/e2e/conftest.py" = ["ARG001"]
"tests/e2e/backends.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.deptry.per_rule_ignores]
DEP001 = ["opentelemetry"]
DEP002 = [
    "alembic",
    "asyncpg",
    "aiosqlite",
    "asyncmy",
    "opentelemetry-instrumentation-sqlalchemy",
]
DEP003 = ["sqlargon", "typing_extensions", "pydantic_core", "starlette"]

[tool.pyright]
venvPath = "."
venv = ".venv"
