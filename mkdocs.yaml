site_name: "SQLArgon"
site_description: SQLAlchemy asyncio session and core query wrapper with useful utils.
theme:
  name: "material"
  palette:
  - scheme: default

    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode
  - scheme: slate
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to light mode
  features:
  - search.suggest
  - search.highlight
  - content.tabs.link
repo_name: sqlargon
repo_url: https://github.com/asynq-io/sqlargon
nav:
  - "SQLArgon": index.md
  - "Usage": usage.md
  - "Database Routing": routing.md
  - "Pagination": pagination.md
  - "Cron": cron.md
  - "Outbox": outbox.md
  - "Auditable Models": auditable.md
  - "Examples": examples.md
  - "Reference":
    - "Column Types & Mixins": reference/types.md
    - "Dialects": reference/dialects.md
    - "Settings": reference/settings.md
    - "API": reference/api.md
  - "Alembic Migrations": migrations.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            show_signature_annotations: true
            docstring_style: sphinx
